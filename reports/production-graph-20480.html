<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Production Graph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ---- design tokens: dark-first industrial planning tool ---- */
:root {
  --bg: #10161e;
  --panel: #18212d;
  --line: #26303d;
  --fg: #e8eef6;
  --fg-soft: #9aaabc;
  --accent: #53e6a8;
  --sink-bg: #f0b23a;
  --sink-border: #c68f1a;
  --edge-line: #55677d;
  --edge-fg: #a8b6c6;
  --node-text: #101a24;
  --font-ui: "Inter", system-ui, sans-serif;
  --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f7fa;
    --panel: #ffffff;
    --line: #dbe3ec;
    --fg: #1a2430;
    --fg-soft: #5a6b7e;
    --sink-bg: #f0b23a;
    --sink-border: #c68f1a;
    --edge-line: #9fb0c2;
    --edge-fg: #5a6b7e;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f7fa; --panel: #ffffff; --line: #dbe3ec; --fg: #1a2430; --fg-soft: #5a6b7e;
  --sink-bg: #f0b23a; --sink-border: #c68f1a; --edge-line: #9fb0c2; --edge-fg: #5a6b7e;
  color-scheme: light;
}

html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel);
}

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  margin: 12px 0; padding: 12px 14px;
  display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center;
}
header h1 {
  margin: 0; font-family: var(--font-head); font-size: 20px; font-weight: 600;
  letter-spacing: 0.2px; text-wrap: balance;
}
header h1 + p { margin: 2px 0 0; font-size: 12px; color: var(--fg-soft); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat {
  font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums;
  color: var(--fg); background: rgba(83,230,168,0.10); border: 1px solid var(--line);
  padding: 4px 9px; border-radius: 999px; white-space: nowrap;
}
.stat b { color: var(--accent); font-weight: 600; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-left: auto; }
.controls input[type="search"] {
  font-family: var(--font-mono); font-size: 12px; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; width: 180px; min-width: 0;
}
.controls label { font-size: 12px; color: var(--fg-soft); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
.hint { font-size: 11px; color: var(--fg-soft); font-family: var(--font-mono); }

.legend { display: flex; flex-wrap: wrap; gap: 5px 14px; align-items: center; padding: 6px 14px 8px; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-soft); }
.legend .chip { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.25); }
.legend .chip.round { border-radius: 50%; }

#graph-wrap {
  flex: 1 1 auto; min-height: 0; position: relative; margin-bottom: 12px;
}
#graph {
  position: absolute; inset: 0;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); overflow: hidden;
}
#graph::before {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 44px 44px; opacity: 0.35;
}
#focus-chip {
  position: absolute; top: 12px; left: 14px; z-index: 5; display: none;
  font-family: var(--font-mono); font-size: 11px; color: var(--fg);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 10px; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  cursor: pointer;
}

@media (max-width: 640px) {
  .controls { margin-left: 0; width: 100%; }
  .controls input[type="search"] { flex: 1 1 auto; width: auto; }
}
</style>
</head>

</header>
<div class="legend" id="legend"></div>
<div id="graph-wrap"><span id="focus-chip"></span><div id="graph"></div></div>

const styles = getComputedStyle(document.documentElement);
const V = (n) => styles.getPropertyValue(n).trim();
const nodeText = V("--node-text") || "#101a24";

function fmtRate(r) {
  if (r >= 1e6) return (r / 1e6).toFixed(2) + "M";
  if (r >= 1e5) return (r / 1e3).toFixed(0) + "k";
  if (r >= 1e3) return (r / 1e3).toFixed(1) + "k";
  return Math.round(r * 10) / 10 + "";
}

const NODE_FONT = { multi: "markdown", size: 12, face: "monospace" };

const nodesView = new vis.DataSet(
  DATA.nodes.map((n) => {
    const base = {
      id: n.id, label: n.label, x: n.x, y: n.y,
      font: Object.assign({}, NODE_FONT, { color: nodeText }),
      title: n.title,
    };
    if (n.kind === "recipe") {
      base.shape = "box";
      base.color = { background: DATA.machineColors[n.machine].bg, border: DATA.machineColors[n.machine].border };
    } else if (n.kind === "sink") {
      base.shape = "diamond";
      base.color = { background: V("--sink-bg"), border: V("--sink-border") };
    }
    return base;
  })
);

const edgeBase = {
  arrows: "to",
  width: 1,
  font: { size: 9, align: "center", face: "monospace", color: V("--edge-fg"), strokeWidth: 3, strokeColor: V("--bg") },
  color: { color: V("--edge-line"), opacity: 0.85, highlight: V("--accent") },
  smooth: { enabled: true, type: "cubicBezier", roundness: 0.4 },
};
const edgesView = new vis.DataSet(
  DATA.edges.map((e) => Object.assign({}, edgeBase, {
    from: e.from, to: e.to,
    label: e.flows.map(([nm, r]) => nm + " " + fmtRate(r)).join(", "),
    title: e.flows.map(([nm, r]) => nm + "  " + r.toLocaleString(undefined, { maximumFractionDigits: 1 }) + "/min").join("\n"),
  }))
);

const container = document.getElementById("graph");
const network = new vis.Network(container, { nodes: nodesView, edges: edgesView }, {
  // Node coordinates come from the Python-side layered layout (x/y on each
  // node); physics stays off so those exact positions are kept.
  physics: false,
  layout: { hierarchical: { enabled: false } },
  interaction: { hover: true, tooltipDelay: 120, navigationButtons: true, keyboard: true },
});

// ---- header: caption + stats + legend --------------------------------------
const m = DATA.meta;
document.getElementById("caption").textContent =
  `${m.cap_label} · ${m.n_recipes} recipe nodes · ${m.n_edges} item-flow edges`;
document.getElementById("stats").innerHTML =
  `<span class="stat">sink <b>${m.points.toLocaleString()}</b> pts/min</span>` +
  `<span class="stat"><b>${m.machines.toLocaleString(undefined, { maximumFractionDigits: 0 })}</b> machines</span>` +
  `<span class="stat">power <b>${m.power.toLocaleString()}</b> MW</span>` +
  `<span class="stat">sloops <b>${m.sloops}</b></span>` +
  `<span class="stat">augmenters <b>${m.augmenters}</b></span>`;
const legendEl = document.getElementById("legend");
DATA.legend.forEach(([machine, title, bg]) => {
  const d = document.createElement("span");
  d.className = "item";
  d.innerHTML = `<span class="chip" style="background:${bg}"></span>${title}`;
  legendEl.appendChild(d);
});
{
  const s = document.createElement("span");
  s.className = "item";
  s.innerHTML = `<span class="chip" style="background:${V("--sink-bg")}"></span>Awesome Sink (surplus flow)`;
  legendEl.appendChild(s);
}

// Fit once the layout has settled (hierarchical layout is synchronous at
// creation, but damping the fit past initial render keeps it stable).
let fitN = 0;
function settleFit() {
  network.fit({ padding: 40, animation: true });
  if (++fitN < 2) setTimeout(settleFit, 900);
}
setTimeout(settleFit, 250);

// ---- filters ----------------------------------------------------------------
let qTimer = null;
document.getElementById("q").addEventListener("input", (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => applySearch(e.target.value), 200);
});
function applySearch(q) {
  q = q.trim().toLowerCase();
  const hide = new Set();
  if (q) {
    DATA.nodes.forEach((n) => {
      const hay = (n.id + " " + n.label.replace(/[^a-z0-9 ]/gi, " ")).toLowerCase();
      if (!hay.includes(q)) hide.add(n.id);
    });
  }
  nodesView.update(DATA.nodes.map((n) => ({ id: n.id, hidden: !!hide.has(n.id) })));
  network.redraw();
  if (q) {
    network.fit({ nodes: DATA.nodes.filter((n) => !hide.has(n.id)).map((n) => n.id), padding: 40, animation: true });
  }
}

document.getElementById("show-edge-labels").addEventListener("change", (e) => {
  network.setOptions({ edges: { font: Object.assign({}, edgeBase.font, { size: e.target.checked ? 9 : 0 }) } });
});

// ---- click: focus a node's neighbourhood ------------------------------------
let focused = null;
const chip = document.getElementById("focus-chip");
function clearFocus() {
  focused = null;
  chip.style.display = "none";
  nodesView.update(DATA.nodes.map((n) => ({ id: n.id, hidden: false })));
  network.redraw();
  network.fit({ padding: 40, animation: true });
}
network.on("click", (p) => {
  if (!p.nodes.length) { clearFocus(); return; }
  const id = p.nodes[0];
  if (id === focused) { clearFocus(); return; }
  const connected = network.getConnectedNodes(id, "to").concat(network.getConnectedNodes(id, "from"));
  const keep = new Set([id, ...connected]);
  focused = id;
  nodesView.update(DATA.nodes.map((n) => ({ id: n.id, hidden: !keep.has(n.id) })));
  network.redraw();
  const node = nodesView.get(id);
  const match = node.label.replace(/\*\*/g, "").replace(/\n/g, " ").replace(/\s+/g, " ").trim();
  chip.textContent = "focus: " + match.slice(0, 80);
  chip.style.display = "block";
});
chip.addEventListener("click", clearFocus);
